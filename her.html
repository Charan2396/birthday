<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>A door</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --sand:#fdf3e3;
    --sand-2:#fbe7cf;
    --gold:#e8b04b;
    --gold-dk:#c98a2e;
    --rose:#e8899b;
    --rose-dk:#c96379;
    --ocean-dk:#1c6674;
    --ink:#4a3730;
    --ink-soft:#8a7160;
    --paper:#fffdf8;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif; color:var(--ink);
    background:
      radial-gradient(900px 520px at 100% 0%, rgba(232,137,155,0.18), transparent 60%),
      radial-gradient(900px 600px at 0% 25%, rgba(232,176,75,0.16), transparent 55%),
      linear-gradient(180deg,var(--sand) 0%,var(--sand-2) 60%,#f6ddc2 100%);
    overflow-x:hidden; min-height:100vh;
  }

  /* ================= GATE ================= */
  #gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:linear-gradient(180deg,#f7e2c8 0%,#efc9ba 50%,#dcaab4 100%);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #gate.open{opacity:0; visibility:hidden; pointer-events:none;}
  .gate-card{
    width:min(420px,100%);
    background:var(--paper);
    border-radius:20px;
    border:1px solid rgba(232,176,75,0.4);
    box-shadow:0 26px 60px rgba(74,55,48,0.24);
    padding:40px 30px 34px;
    text-align:center;
  }
  .gate-lock{font-size:2.2rem; line-height:1;}
  .gate-t{
    font-family:'Fraunces',serif; font-style:italic;
    font-size:1.45rem; line-height:1.4; color:var(--rose-dk); margin-top:16px;
  }
  .gate-s{font-size:0.88rem; line-height:1.65; color:var(--ink-soft); margin-top:12px;}
  .gate-form{margin-top:24px; display:flex; flex-direction:column; gap:12px;}
  .gate-form input{
    font-family:'Poppins',sans-serif; font-size:1.05rem; text-align:center;
    padding:14px 16px; border-radius:12px;
    border:1px solid rgba(201,99,121,0.35);
    background:var(--sand); color:var(--ink); outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .gate-form input:focus{border-color:var(--rose-dk); box-shadow:0 0 0 3px rgba(232,137,155,0.2);}
  .gate-form button{
    font-family:'Poppins',sans-serif; font-weight:600;
    font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase;
    padding:14px 18px; border-radius:12px; border:0; cursor:pointer;
    background:var(--rose-dk); color:#fff;
    transition:background .2s ease, transform .15s ease;
  }
  .gate-form button:hover{background:#b5566b;}
  .gate-form button:active{transform:scale(.985);}
  .gate-form button[disabled]{opacity:.6; cursor:default;}
  .gate-msg{margin-top:14px; min-height:20px; font-size:0.84rem; color:var(--rose-dk);}
  .gate-msg.quiet{color:var(--ink-soft);}
  .shake{animation:shake .45s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);} 40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);} 80%{transform:translateX(3px);}
  }
  .gate-foot{margin-top:22px; font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(138,113,96,0.75);}
  .gate-foot a{color:inherit;}

  /* ================= PRIVATE CONTENT ================= */
  #vault{opacity:0; transition:opacity 1s ease;}
  #vault.shown{opacity:1;}

  .p-hero{
    min-height:92vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:80px 24px; position:relative;
    background:linear-gradient(180deg,#ffe6b8 0%,#ffc98d 38%,#ff9f86 68%,#ef8fa2 100%);
  }
  .p-eyebrow{
    font-size:0.7rem; font-weight:600; letter-spacing:0.34em;
    text-transform:uppercase; color:#a24a4a; margin-bottom:16px;
  }
  .p-title{
    font-family:'Pacifico',cursive; font-size:clamp(2.8rem,12vw,5.6rem);
    line-height:1.06; color:#fff; text-shadow:0 4px 22px rgba(160,60,70,0.35);
  }
  .p-name{
    font-family:'Pacifico',cursive; font-size:clamp(1.8rem,8vw,3.4rem);
    color:#fff; margin-top:4px; text-shadow:0 4px 22px rgba(160,60,70,0.4);
  }
  .p-lead{
    margin:20px auto 0; max-width:520px;
    font-size:clamp(0.98rem,2.6vw,1.14rem); line-height:1.75; color:#5a2f33;
  }

  .p-band{padding:74px 24px;}
  .p-center{max-width:660px; margin:0 auto; text-align:center;}
  .p-label{
    font-size:0.63rem; font-weight:600; letter-spacing:0.32em;
    text-transform:uppercase; color:var(--gold-dk); margin-bottom:16px; text-align:center;
  }
  .p-lead-2{font-size:1.02rem; line-height:1.8; color:var(--ink);}

  .p-note{
    max-width:600px; margin:0 auto;
    background:var(--paper); border-radius:14px;
    border:1px solid rgba(232,176,75,0.35);
    box-shadow:0 20px 44px rgba(74,55,48,0.16);
    padding:38px 34px;
  }
  .p-note p{
    font-family:'Fraunces',serif; font-style:italic;
    font-size:clamp(1.04rem,2.8vw,1.22rem); line-height:1.8; color:var(--ink);
  }
  .p-note p + p{margin-top:18px;}
  .p-sign{
    font-family:'Pacifico',cursive; font-size:1.5rem;
    color:var(--rose-dk); margin-top:24px; text-align:right;
  }

  .p-wed{
    text-align:center;
    background:
      radial-gradient(700px 380px at 50% 0%, rgba(232,176,75,0.18), transparent 65%),
      linear-gradient(180deg,#fff7ea,#f6e7cf);
    border-top:1px solid rgba(201,138,46,0.25);
    border-bottom:1px solid rgba(201,138,46,0.25);
  }
  .p-wed-line{
    font-family:'Fraunces',serif; font-style:italic;
    font-size:clamp(1.5rem,5vw,2.5rem); line-height:1.3;
    color:var(--rose-dk); max-width:620px; margin:0 auto 26px;
  }
  .p-cd{display:flex; justify-content:center; gap:14px; flex-wrap:wrap;}
  .p-cd-num{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:clamp(2.6rem,10vw,4.4rem); line-height:1; color:var(--ocean-dk);
    font-variant-numeric:tabular-nums;
  }
  .p-cd-lbl{
    font-size:0.58rem; font-weight:600; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--ink-soft); margin-top:8px;
  }
  .p-wed-date{
    font-family:'Fraunces',serif; font-style:italic;
    color:var(--gold-dk); font-size:1.05rem; margin-top:18px;
  }

  /* the note about making the video */
  .p-video-note{
    background:
      radial-gradient(700px 360px at 50% 0%, rgba(232,137,155,0.14), transparent 65%),
      linear-gradient(180deg,#fffaf2,#fdf0e4);
  }
  .p-quote-card{
    max-width:640px; margin:0 auto; position:relative;
    background:var(--paper); border-radius:14px;
    border:1px solid rgba(201,99,121,0.3);
    box-shadow:0 20px 44px rgba(74,55,48,0.14);
    padding:40px 36px 36px;
  }
  .p-quote-card::before{
    content:"\201C"; position:absolute; top:-8px; left:22px;
    font-family:'Fraunces',serif; font-size:5rem; line-height:1;
    color:rgba(201,99,121,0.22);
  }
  .p-quote-card p{
    font-family:'Fraunces',serif; font-style:italic;
    font-size:clamp(1.02rem,2.7vw,1.2rem); line-height:1.85; color:var(--ink);
  }

  /* flip cards */
  .p-cards{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:16px; max-width:760px; margin:32px auto 0;
  }
  .p-card{perspective:1000px; cursor:pointer; outline:none;}
  .p-card-in{
    position:relative; width:100%; aspect-ratio:3/4;
    transition:transform .65s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .p-card.flipped .p-card-in{transform:rotateY(180deg);}
  .p-card:focus-visible .p-card-in{box-shadow:0 0 0 3px rgba(201,99,121,0.4); border-radius:14px;}
  .p-face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:18px; text-align:center;
    border-radius:14px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 12px 28px rgba(74,55,48,0.14);
  }
  .p-front{background:linear-gradient(160deg,#ffd7e6,#f7b7cf); border:1px solid rgba(201,99,121,0.25);}
  .p-num{font-family:'Fraunces',serif; font-weight:600; font-size:2.1rem; color:#fff; text-shadow:0 2px 10px rgba(180,80,100,0.35);}
  .p-back{
    background:var(--paper); border:1px solid rgba(232,176,75,0.4);
    transform:rotateY(180deg);
  }
  .p-back p{
    font-family:'Fraunces',serif; font-style:italic;
    font-size:0.92rem; line-height:1.6; color:var(--ink);
  }
  .p-hint{margin-top:20px; text-align:center; font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-soft);}

  .p-wed-note{
    max-width:480px; margin:26px auto 0;
    font-size:0.95rem; line-height:1.75; color:var(--ink-soft);
  }

  /* optional photo grid */
  .p-gallery{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px; max-width:920px; margin:32px auto 0;
  }
  .p-frame{
    background:var(--paper); padding:9px 9px 12px; border-radius:5px;
    box-shadow:0 9px 20px rgba(74,55,48,0.14);
    transform:rotate(var(--r,0deg));
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .p-frame:hover{transform:rotate(0) translateY(-3px); box-shadow:0 15px 28px rgba(74,55,48,0.2);}
  .p-frame:nth-child(3n){--r:1.6deg;}
  .p-frame:nth-child(3n+1){--r:-1.6deg;}
  .p-pic{width:100%; aspect-ratio:4/5; border-radius:3px; overflow:hidden; background:var(--sand-2);}
  .p-pic img{width:100%; height:100%; object-fit:cover; display:block;}

  .p-closing{padding-bottom:90px;}
  .p-final{
    font-family:'Fraunces',serif; font-style:italic;
    font-size:clamp(1.2rem,3.6vw,1.7rem); line-height:1.6; color:var(--ink);
  }
  .p-mono{font-family:'Pacifico',cursive; font-size:2rem; color:var(--gold); opacity:.7; margin-top:24px;}

  .p-reveal{opacity:0; transform:translateY(22px); transition:opacity .9s ease, transform .9s ease;}
  .p-reveal.on{opacity:1; transform:none;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
    .p-reveal{opacity:1; transform:none;}
    .p-card-in{transition:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<!-- the door -->
<div id="gate">
  <div class="gate-card" id="gateCard">
    <div class="gate-lock">&#128274;</div>
    <p class="gate-t">this one is not for everyone.</p>
    <p class="gate-s">There is a name only one person calls me. If you are her, you already know it.</p>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <input id="gateInput" type="password" inputmode="text"
             placeholder="what do you call me?"
             aria-label="nickname"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"/>
      <button type="submit" id="gateBtn">open it</button>
    </form>
    <p class="gate-msg" id="gateMsg"></p>
    <p class="gate-foot"><a href="index.html">&larr; back to the party</a></p>
  </div>
</div>

<!-- everything below is decrypted at runtime -->
<main id="vault" aria-live="polite"></main>

<script src="her.sealed.js"></script>
<script>
/* =========================================================
   The content of this page is encrypted with the nickname.
   Nothing readable is shipped in this file - if you do not
   know the word, there is nothing here to find.
   ========================================================= */
(function(){
  const gate  = document.getElementById('gate');
  const card  = document.getElementById('gateCard');
  const form  = document.getElementById('gateForm');
  const input = document.getElementById('gateInput');
  const btn   = document.getElementById('gateBtn');
  const msg   = document.getElementById('gateMsg');
  const vault = document.getElementById('vault');

  const SEALED = window.__SEALED__;
  const KEY_STORE = 'bd_open';

  function say(text, quiet){
    msg.textContent = text || '';
    msg.classList.toggle('quiet', !!quiet);
  }

  if(!window.crypto || !window.crypto.subtle){
    say('This page needs a secure connection. Open it on the real link (https), not as a local file.');
    btn.disabled = true;
    return;
  }
  if(!SEALED || !SEALED.ct){
    say('Nothing has been sealed into this page yet.');
    btn.disabled = true;
    return;
  }

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function unlock(phrase){
    const norm = (phrase || '').trim().toLowerCase();
    if(!norm) return null;

    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(SEALED.salt), iterations:SEALED.iter || 250000, hash:'SHA-256' },
      base,
      { name:'AES-GCM', length:256 },
      false, ['decrypt']
    );
    // throws if the word is wrong - GCM will not authenticate
    const plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(SEALED.iv) }, key, b64(SEALED.ct)
    );
    return new TextDecoder().decode(plain);
  }

  let misses = 0;
  const nudges = [
    'that is not it. you know this one.',
    'nope. think about what you actually call me.',
    'still no. the one you use in front of everyone.'
  ];

  async function attempt(phrase, silent){
    btn.disabled = true;
    if(!silent) say('opening…', true);
    let html = null;
    try{
      html = await unlock(phrase);
    }catch(e){
      html = null;
    }
    btn.disabled = false;

    if(html === null){
      if(silent){ say(''); return false; }
      misses++;
      say(nudges[Math.min(misses - 1, nudges.length - 1)]);
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      input.value = '';
      input.focus();
      return false;
    }

    say('');
    try{ sessionStorage.setItem(KEY_STORE, phrase.trim().toLowerCase()); }catch(e){}
    open(html);
    return true;
  }

  function open(html){
    vault.innerHTML = html;
    gate.classList.add('open');
    setTimeout(() => { gate.remove(); }, 800);
    requestAnimationFrame(() => vault.classList.add('shown'));
    activate();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    attempt(input.value, false);
  });

  // already opened in this tab? do not make her type it twice
  (async function(){
    let saved = null;
    try{ saved = sessionStorage.getItem(KEY_STORE); }catch(e){}
    if(saved){ await attempt(saved, true); }
    input.focus();
  })();

  /* ---- wire up whatever the decrypted content contains ---- */
  function activate(){

    // live countdowns:  <span data-countdown="2027-03-14">
    const cds = vault.querySelectorAll('[data-countdown]');
    if(cds.length){
      const DAY = 86400000;
      const tick = () => {
        const now = Date.now();
        cds.forEach(el => {
          const parts = (el.getAttribute('data-countdown') || '').split('-').map(Number);
          if(parts.length !== 3 || parts.some(isNaN)) return;
          const t = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0).getTime();
          const d = t - now;
          el.textContent = d > 0 ? Math.ceil(d / DAY) : 0;
        });
      };
      tick();
      setInterval(tick, 30000);
    }

    // flip cards
    vault.querySelectorAll('.p-card').forEach(c => {
      const flip = () => c.classList.toggle('flipped');
      c.addEventListener('click', flip);
      c.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); }
      });
    });

    // photo grid:  <div class="p-gallery" data-count="12" data-dir="pics"></div>
    vault.querySelectorAll('.p-gallery').forEach(g => {
      const n = parseInt(g.getAttribute('data-count') || '0', 10);
      const dir = g.getAttribute('data-dir') || 'pics';
      for(let i = 1; i <= n; i++){
        const f = document.createElement('div');
        f.className = 'p-frame';
        f.innerHTML =
          '<div class="p-pic"><img src="' + dir + '/' + i + '.jpg" alt="" loading="lazy" ' +
          'onerror="this.closest(\'.p-frame\').style.display=\'none\';"/></div>';
        g.appendChild(f);
      }
    });

    // reveal on scroll
    vault.querySelectorAll('.p-band, .p-hero').forEach(el => el.classList.add('p-reveal'));
    if(!('IntersectionObserver' in window)){
      vault.querySelectorAll('.p-reveal').forEach(el => el.classList.add('on'));
      return;
    }
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); }
      });
    }, { threshold:0.08, rootMargin:'0px 0px -40px 0px' });
    vault.querySelectorAll('.p-reveal').forEach(el => io.observe(el));
  }
})();
</script>
</body>
</html>
